# A release: builds the Windows installer and publishes it as a GitHub Release, which the
# installed apps then update themselves from (#49). README › Releasing has the steps.
#
# Two ways to start it:
#   - The button: Actions › Release › "Run workflow", choosing patch / minor / major. The first job
#     raises `version` in package.json, commits that to main and tags it - no PR, no local git.
#   - Pushing a tag `v<version>` by hand, as before; the tag must name the version in package.json.
#
# Order: version (and tag), then the full CI gate on exactly that commit (ci.yml, called with the
# tag), and only then is the installer built on windows-latest and the release created. A red gate
# publishes nothing (a version commit made by the button stays on main; the next run moves on).
#
# What it deliberately does NOT do:
#   - sign the installer (#48): SmartScreen warns on first start until it is signed.
#   - let electron-builder publish: it runs with --publish never and the release job uploads the
#     installer together with latest.yml and the .blockmap, which the installed apps read to
#     update themselves (#49, src/main/app/updates.ts).
#   - build macOS or Linux packages: the app is used on Windows.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Neue Version: patch = Fehlerbehebungen (1.0.0 → 1.0.1), minor = neue Funktionen (1.0.0 → 1.1.0), major = große Umstellung (1.0.0 → 2.0.0)'
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: read

# One run per tag; a second push of the same tag waits instead of racing the first
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # the button pushes the version commit and the tag; a tag push only reads
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      # The button: next version in package.json, committed to main and tagged. Tags pushed with
      # the workflow token start no workflow, so this run goes on with it instead of a second one.
      - name: Raise the version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(npm version "$BUMP" --no-git-tag-version)
          version=${version#v}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release v${version}"
          git tag "v${version}"
          git push origin HEAD:main
          git push origin "v${version}"
          echo "Raised to ${version}"

      - name: Tag matches package.json
        id: tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::Tag ${tag} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

  gate:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  installer:
    needs: [version, gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall rebuilds better-sqlite3 for Electron's ABI, which is what the package ships
      - run: pnpm install --frozen-lockfile

      - name: Electron binary
        uses: ./.github/actions/electron-binary

      # Typecheck and electron-vite build, then the NSIS installer. --publish never: the
      # release job below uploads it, electron-builder must not try on its own when it sees a tag.
      - name: Build the installer
        run: |
          pnpm build
          pnpm exec electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          # latest.yml and the blockmap are the auto-update metadata (#49)
          path: |
            dist/Bookingium-Setup-*.exe
            dist/Bookingium-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    needs: [version, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer

      # Notes are generated from the PRs merged since the previous tag
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >-
          gh release create "${TAG}" Bookingium-Setup-*.exe
          Bookingium-Setup-*.exe.blockmap latest.yml
          --repo "${GITHUB_REPOSITORY}"
          --title "Bookingium ${TAG#v}"
          --generate-notes
          --verify-tag
