# Only these packages are allowed to run lifecycle scripts (postinstall etc.).
# Everything else is installed with scripts disabled - supply-chain hardening
# against install-script malware. Add a package here only if it genuinely
# needs a build/download step (native modules, binary downloads).
allowBuilds:
  electron: true
  better-sqlite3: true
  esbuild: true
  '@tailwindcss/oxide': true
  electron-winstaller: true
  node-abi: true
  canvas: true
  core-js: false
  es5-ext: false

# Security: esbuild < 0.28.1 has published advisories; drizzle-kit and electron-vite pin older
# ranges, so every copy is lifted to the patched line (build-time only, nothing ships in the app).
overrides:
  esbuild: ^0.28.2

# electron-trpc 0.7.1 passes an input on only when it is truthy, so false, 0, '' and null reach
# the procedures as undefined (a switch could not be turned off). Guarded by
# tests/ipc_falsy_input.test.ts; drop the patch once an update fixes it upstream.
patchedDependencies:
  electron-trpc@0.7.1: patches/electron-trpc@0.7.1.patch
