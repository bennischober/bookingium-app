appId: com.bookingium.app
productName: Bookingium
directories:
  buildResources: build
  output: dist
# Allow-list: only the built app goes into the package (plus the runtime
# dependencies electron-builder adds). Never sample_data, docs, tests,
# tool configs or local keys.
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
extraResources:
  - from: src/main/db/migrations
    to: migrations
    filter:
      - '**/*'
win:
  executableName: Bookingium
  target:
    - nsis
nsis:
  artifactName: Bookingium-Setup-${version}.${ext}
  # Installer with choices (folder), per user: no admin rights needed
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Bookingium
  uninstallDisplayName: Bookingium
  # Uninstalling keeps the data (database, documents) in %APPDATA%
  deleteAppDataOnUninstall: false
  installerLanguages:
    - de_DE
  language: '1031'
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: Bookingium-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: Benjamin Schober
  category: Office
appImage:
  artifactName: Bookingium-${version}.${ext}
npmRebuild: false
